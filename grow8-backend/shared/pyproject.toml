[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grow8-common"
version = "0.1.0"
description = "Shared settings, DB session, models, event schemas and messaging for GROW8"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.11.4",
    "pydantic-settings==2.9.1",
    "SQLAlchemy==2.0.40",
    "PyMySQL==1.1.1",
    # required by PyMySQL for MySQL 8's caching_sha2_password auth
    "cryptography==44.0.3",
    "pika==1.3.2",
    "tenacity==9.1.2",
]

[tool.setuptools.packages.find]
include = ["grow8_common*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
