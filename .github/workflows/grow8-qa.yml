name: Grow8 QA - Frontend / Backend / Database

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      layer:
        description: Which layer to execute?
        required: true
        type: choice
        default: all
        options: [all, frontend, backend, database]
      suite:
        description: Select a test suite
        required: true
        type: choice
        default: regression
        options: [smoke, sanity, regression]

permissions:
  contents: read

jobs:
  frontend:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.layer == 'all' || inputs.layer == 'frontend' }}
    name: Frontend - ${{ inputs.suite || 'regression' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: grow8-/package-lock.json
      - name: Install React dependencies
        run: npm ci --prefix grow8-
      - name: Install QA dependencies
        run: npm install --prefix qa --no-audit --no-fund
      - name: Install Chromium
        working-directory: qa
        run: npx playwright install --with-deps chromium
      - name: Run frontend tests
        working-directory: qa
        run: npm run test:frontend:${{ inputs.suite || 'regression' }}
      - name: Upload frontend HTML reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grow8-frontend-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/reports/frontend/
          if-no-files-found: warn
          retention-days: 30

  backend:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.layer == 'all' || inputs.layer == 'backend' }}
    name: Backend - ${{ inputs.suite || 'regression' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      API_URL: http://127.0.0.1:8000
      SEED_PASSWORD: Grow8Dev!2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare temporary environment
        working-directory: grow8-backend
        run: cp .env.example .env
      - name: Start API with MySQL and RabbitMQ
        working-directory: grow8-backend
        run: docker compose up -d --build api
      - name: Wait for healthy API
        shell: bash
        run: |
          for n in {1..90}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 3
          done
          echo 'API failed to become ready'
          docker compose -f grow8-backend/docker-compose.yml -f grow8-backend/docker-compose.override.yml --env-file grow8-backend/.env ps
          exit 1
      - name: Install QA dependencies
        run: npm install --prefix qa --no-audit --no-fund
      - name: Run backend tests
        working-directory: qa
        run: npm run test:backend:${{ inputs.suite || 'regression' }}
      - name: Upload backend HTML reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grow8-backend-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/reports/backend/
          if-no-files-found: warn
          retention-days: 30
      - name: Docker diagnostics on failure
        if: failure()
        working-directory: grow8-backend
        run: docker compose logs --no-color --tail=120
      - name: Tear down temporary services
        if: always()
        working-directory: grow8-backend
        run: docker compose down -v --remove-orphans

  database:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.layer == 'all' || inputs.layer == 'database' }}
    name: Database - ${{ inputs.suite || 'regression' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      DB_HOST: 127.0.0.1
      DB_PORT: '3307'
      DB_USER: grow8
      DB_PASSWORD: change-me
      DB_NAME: grow8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare temporary database environment
        working-directory: grow8-backend
        run: cp .env.example .env
      - name: Start MySQL only
        working-directory: grow8-backend
        run: docker compose up -d mysql
      - name: Wait for MySQL readiness
        shell: bash
        run: |
          for n in {1..90}; do
            if docker compose -f grow8-backend/docker-compose.yml -f grow8-backend/docker-compose.override.yml --env-file grow8-backend/.env exec -T mysql sh -c 'mysqladmin ping -h 127.0.0.1 -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent' >/dev/null 2>&1; then exit 0; fi
            sleep 3
          done
          echo 'MySQL failed to become ready'
          exit 1
      - name: Install QA dependencies
        run: npm install --prefix qa --no-audit --no-fund
      - name: Run database tests
        working-directory: qa
        run: npm run test:database:${{ inputs.suite || 'regression' }}
      - name: Upload database HTML reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grow8-database-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/reports/database/
          if-no-files-found: warn
          retention-days: 30
      - name: Docker diagnostics on failure
        if: failure()
        working-directory: grow8-backend
        run: docker compose logs --no-color --tail=120
      - name: Tear down temporary services
        if: always()
        working-directory: grow8-backend
        run: docker compose down -v --remove-orphans
